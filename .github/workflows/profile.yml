# Genera las estadísticas, la actividad y la serpiente del perfil y las publica
# en la rama `output`, desde donde las lee el README.
name: Profile assets

on:
  schedule:
    - cron: "17 */6 * * *" # cada 6 horas
  workflow_dispatch: # botón "Run workflow" en la pestaña Actions
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Stats + actividad (SVG propios)
        run: node scripts/generate-stats.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Serpiente
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ff003c&color_dots=#161b22,#4d0011,#8a001f,#c7002d,#ff003c
            dist/snake-light.svg?color_snake=#c7002d&color_dots=#ebedf0,#ffc2cd,#ff7a93,#e6002e,#8a001f

      - name: Publicar en la rama output
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: actualizar assets del perfil"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
